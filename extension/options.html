<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>YouTube → Obsidian 설정</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 560px;
      margin: 32px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin-top: 28px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .hint { font-size: 12px; color: #777; margin-top: 4px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; }
    button {
      margin-top: 24px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #7c3aed;
      color: #fff;
      cursor: pointer;
    }
    #saved { margin-left: 12px; color: #059669; font-size: 13px; }
  </style>
</head>
<body>
  <h1>YouTube → Obsidian 설정</h1>

  <h2>Claude</h2>
  <label for="anthropicApiKey">Anthropic API 키</label>
  <input type="password" id="anthropicApiKey" placeholder="sk-ant-..." />
  <div class="hint">이 브라우저에만 저장됩니다 (chrome.storage.local).</div>

  <label for="model">모델</label>
  <input type="text" id="model" placeholder="claude-opus-4-8" />

  <div class="checkbox-row">
    <input type="checkbox" id="doAnalysis" />
    <label for="doAnalysis" style="margin: 0;">기본적으로 Claude 분석 실행</label>
  </div>

  <h2>Obsidian</h2>
  <label for="obsidianApiKey">Local REST API 키</label>
  <input type="password" id="obsidianApiKey" placeholder="Obsidian → Local REST API 플러그인 설정에서 복사" />
  <div class="hint">
    Obsidian에 <b>Local REST API</b> 커뮤니티 플러그인을 설치하고, 플러그인 설정에서
    "Enable Non-encrypted (HTTP) Server"를 켜세요. 비워두면 노트를 .md 파일로 다운로드합니다.
  </div>

  <label for="obsidianBaseUrl">Local REST API 주소</label>
  <input type="text" id="obsidianBaseUrl" placeholder="http://127.0.0.1:27123" />

  <label for="obsidianFolder">Vault 내 저장 폴더</label>
  <input type="text" id="obsidianFolder" placeholder="YouTube" />

  <h2>자막</h2>
  <label for="languages">언어 우선순위 (쉼표 구분)</label>
  <input type="text" id="languages" placeholder="ko,en" />

  <button id="save">저장</button><span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
