<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    #video-title {
      font-size: 12px;
      color: #555;
      margin-bottom: 12px;
      max-height: 3em;
      overflow: hidden;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #7c3aed;
      color: #fff;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:disabled { background: #c4b5fd; cursor: default; }
    button.secondary {
      background: #ede9fe;
      color: #5b21b6;
    }
    button.secondary:disabled { background: #f3f0fc; color: #c4b5fd; }
    #stop {
      display: none;
      background: #f3f4f6;
      color: #dc2626;
      border: 1px solid #e5e7eb;
    }
    .step-row { display: flex; gap: 8px; }
    .step-row button { flex: 1; }
    #pipeline-state {
      font-size: 11px;
      color: #6b7280;
      margin: 2px 0 10px;
      line-height: 1.6;
    }
    #progress-wrap {
      display: none;
      margin-top: 4px;
      height: 8px;
      background: #e9e4f8;
      border-radius: 4px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: #7c3aed;
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    #progress-label {
      display: none;
      margin-top: 4px;
      font-size: 11px;
      color: #7c3aed;
      font-weight: 600;
      text-align: right;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      color: #444;
    }
    #status.error { color: #dc2626; }
    #status.success { color: #059669; }
    #other-jobs {
      margin-top: 8px;
      font-size: 11px;
      color: #9ca3af;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .footer { margin-top: 12px; font-size: 11px; }
    .footer a { color: #7c3aed; cursor: pointer; }
  </style>
</head>
<body>
  <h1>YouTube → Obsidian</h1>
  <div id="video-title">영상 확인 중...</div>

  <button id="run-extract">① 트랜스크립트 추출 (자막)</button>
  <button id="run-whisper" class="secondary">① 음성 인식으로 추출 (Whisper·로컬 서버)</button>

  <div id="pipeline-state"></div>

  <div class="step-row">
    <button id="run-polish" class="secondary" disabled>② 자막 교정</button>
    <button id="run-analyze" class="secondary" disabled>③ Claude 분석</button>
  </div>

  <button id="stop">■ 작업 중지</button>

  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="progress-label"></div>
  <div id="status"></div>
  <div id="other-jobs"></div>
  <div class="footer"><a id="open-options">⚙️ 설정 (API 키 / Vault / 모델)</a></div>
  <script src="popup.js"></script>
</body>
</html>
