[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube2obsidian"
version = "0.1.0"
description = "YouTube 영상을 타임스탬프 트랜스크립트로 변환해 Obsidian에 저장하고 Claude로 분석"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "youtube-transcript-api>=0.6.2",
]

[project.optional-dependencies]
whisper = [
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
yt2obsidian = "youtube2obsidian.cli:main"
yt2obsidian-server = "youtube2obsidian.server:main"

[tool.setuptools.packages.find]
include = ["youtube2obsidian*"]
